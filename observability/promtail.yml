server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: superbiz-agent
    static_configs:
      - targets: [localhost]
        labels:
          service_name: super-biz-agent
          __path__: /var/log/superbiz/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: traceId
            span_id: spanId
            logger: logger_name
      - labels:
          level:
          logger:
      - output:
          source: message
